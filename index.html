<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insane Game · Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #090910; --surface: #13131d; --surface-2: #1b1b28; --line: #2a2a3b;
  --text: #f0efec; --text-2: #b9b8c9; --muted: #7c7b8f; --accent: #39ff88;
  --s-yt: #3987e5; --s-ig: #d95926; --s-tt: #199e70;
  --good: #39ff88; --bad: #ff5c7a;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #f4f4f1; --surface: #ffffff; --surface-2: #f0f0ec; --line: #e2e2dc;
    --text: #17171f; --text-2: #4a4a58; --muted: #7a7a86; --accent: #0a8a45;
    --s-yt: #2a78d6; --s-ig: #eb6834; --s-tt: #1baf7a; --good: #0a8a45; --bad: #c62a4a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 500 15px/1.45 Montserrat, system-ui, sans-serif; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 28px 16px 60px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
.logo { font: 400 40px/1 Anton, Impact, sans-serif; letter-spacing: .5px; color: var(--accent); }
.logo span { color: var(--text); }
.updated { color: var(--muted); font-size: 13px; }
h2 { font: 400 22px/1.1 Anton, Impact, sans-serif; letter-spacing: .4px; margin: 34px 0 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
.tile .k { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.tile .v { font: 400 44px/1.1 Anton, Impact, sans-serif; margin-top: 6px; }
.tile .d { font-size: 13px; font-weight: 700; color: var(--muted); }
.up { color: var(--good) !important; } .down { color: var(--bad) !important; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--text-2); margin-bottom: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
#chart { position: relative; }
#chart svg { width: 100%; height: 280px; display: block; }
.tip { position: absolute; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 8px 10px; font-size: 13px; white-space: nowrap; opacity: 0; transition: opacity .1s; }
.tip b { display: block; margin-bottom: 2px; }
.goals { display: grid; gap: 14px; }
.goal .row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.goal .row small { color: var(--muted); font-weight: 600; }
.bar { height: 12px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 999px; }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px;
  border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; white-space: nowrap; }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td:first-child { min-width: 230px; }
td a { color: var(--text-2); text-decoration: none; font-weight: 700; }
td a:hover { color: var(--accent); }
.tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); }
.best td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } .tile .v { font-size: 36px; } }
.note { color: var(--muted); font-size: 12px; margin-top: 8px; }
.empty { color: var(--muted); padding: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">INSANE <span>GAME</span></div>
    <div class="updated" id="updated">Chargement…</div>
  </header>

  <div class="tiles" id="tiles"></div>

  <h2>ABONNÉS DANS LE TEMPS</h2>
  <div class="card">
    <div class="legend" id="legend"></div>
    <div id="chart"><svg id="svg" role="img" aria-label="Abonnés par plateforme"></svg><div class="tip" id="tip"></div></div>
  </div>

  <div class="grid2">
    <div>
      <h2>OBJECTIFS</h2>
      <div class="card goals" id="goals"></div>
    </div>
    <div>
      <h2>COURSE DE BILLES</h2>
      <div class="card tablewrap" id="race"></div>
    </div>
  </div>

  <h2>VIDÉOS PUBLIÉES</h2>
  <div class="card tablewrap"><table id="videos"></table></div>
  <div class="note" id="log"></div>
</div>

<script>
const fmt = n => n == null ? "—" : Number(n).toLocaleString("fr-FR");
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const SERIES = [
  {key: "yt_subs", name: "YouTube", color: "--s-yt"},
  {key: "ig_followers", name: "Instagram", color: "--s-ig"},
  {key: "tt_followers", name: "TikTok", color: "--s-tt"},
];
const flag = c => c && c.length === 2 ? String.fromCodePoint(...[...c.toUpperCase()].map(x => 0x1F1A5 + x.charCodeAt(0))) : "🏳️";

function delta(hist, key, days) {
  const pts = hist.filter(h => h[key] != null);
  if (pts.length < 2) return null;
  const last = pts[pts.length - 1];
  const lim = new Date(last.date); lim.setDate(lim.getDate() - days);
  const base = pts.find(h => new Date(h.date) >= lim) || pts[0];
  return last[key] - base[key];
}

function tiles(st) {
  const h = st.history || [];
  const vids = st.videos || [];
  const ytViews = vids.reduce((a, v) => a + ((v.yt || {}).views || 0), 0);
  const igViews = vids.reduce((a, v) => a + ((v.ig || {}).views || 0), 0);
  const ttViews = (st.tiktok || {}).views || 0;
  const items = [
    ["YouTube abonnés", (st.youtube || {}).subscribers, delta(h, "yt_subs", 7), "--s-yt"],
    ["Instagram abonnés", (st.instagram || {}).followers, delta(h, "ig_followers", 7), "--s-ig"],
    ["TikTok abonnés", (st.tiktok || {}).followers, delta(h, "tt_followers", 7), "--s-tt",
      st.tiktok && st.tiktok.date ? "saisi le " + new Date(st.tiktok.date).toLocaleDateString("fr-FR") : "via /tiktok sur Telegram"],
    ["Vues des Shorts publiés", ytViews + igViews + ttViews, null, null,
      `YT ${fmt(ytViews)} · IG ${fmt(igViews)} · TT ${fmt(ttViews)}`],
  ];
  document.getElementById("tiles").innerHTML = items.map(([k, v, d, c, sub]) => `
    <div class="tile">
      <div class="k">${c ? `<i class="dot" style="background:var(${c})"></i>` : ""}${k}</div>
      <div class="v">${fmt(v)}</div>
      <div class="d ${d > 0 ? "up" : d < 0 ? "down" : ""}">${sub || (d == null ? "pas encore d'historique" : (d >= 0 ? "+" : "") + fmt(d) + " sur 7 jours")}</div>
    </div>`).join("");
}

function chart(st) {
  const hist = (st.history || []).filter(h => SERIES.some(s => h[s.key] != null));
  const svg = document.getElementById("svg"), tip = document.getElementById("tip");
  document.getElementById("legend").innerHTML = SERIES.map(s =>
    `<span><i class="dot" style="background:var(${s.color})"></i>${s.name}</span>`).join("");
  if (hist.length < 1) { svg.outerHTML = '<div class="empty">Les courbes apparaîtront après les premiers relevés.</div>'; return; }
  const W = svg.clientWidth || 800, H = 280, L = 48, R = 86, T = 14, B = 30;
  const xs = hist.map(h => new Date(h.date).getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs) === x0 ? x0 + 864e5 : Math.max(...xs);
  const vals = hist.flatMap(h => SERIES.map(s => h[s.key]).filter(v => v != null));
  let ymax = Math.max(10, ...vals); const mag = Math.pow(10, Math.floor(Math.log10(ymax)));
  ymax = Math.ceil(ymax / mag) * mag;
  const X = t => L + (t - x0) / (x1 - x0) * (W - L - R), Y = v => T + (1 - v / ymax) * (H - T - B);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = ymax * i / 4, y = Y(v);
    g += `<line x1="${L}" x2="${W - R}" y1="${y}" y2="${y}" stroke="${css("--line")}" stroke-width="1"/>
          <text x="${L - 8}" y="${y + 4}" text-anchor="end" font-size="11" fill="${css("--muted")}">${fmt(v)}</text>`;
  }
  const ticks = Math.min(W < 560 ? 3 : 6, hist.length);
  for (let i = 0; i < ticks; i++) {
    const h = hist[Math.round(i * (hist.length - 1) / Math.max(1, ticks - 1))];
    g += `<text x="${X(new Date(h.date).getTime())}" y="${H - 8}" text-anchor="middle" font-size="11" fill="${css("--muted")}">${new Date(h.date).toLocaleDateString("fr-FR", {day: "numeric", month: "short"})}</text>`;
  }
  const ends = [];
  SERIES.forEach(s => {
    const pts = hist.filter(h => h[s.key] != null).map(h => [X(new Date(h.date).getTime()), Y(h[s.key]), h[s.key]]);
    if (!pts.length) return;
    const col = css(s.color);
    g += `<polyline fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${pts.map(p => p[0] + "," + p[1]).join(" ")}"/>`;
    const [lx, ly, lv] = pts[pts.length - 1];
    g += `<circle cx="${lx}" cy="${ly}" r="4" fill="${col}" stroke="${css("--surface")}" stroke-width="2"/>`;
    ends.push({lx, ly, ty: ly, label: `${s.name} ${fmt(lv)}`});
  });
  ends.sort((a, b) => a.ly - b.ly);            // étiquettes de fin sans chevauchement
  for (let i = 1; i < ends.length; i++) ends[i].ty = Math.max(ends[i].ty, ends[i - 1].ty + 16);
  ends.forEach(e => g += `<text x="${e.lx + 9}" y="${e.ty + 4}" font-size="12" font-weight="700" fill="${css("--text-2")}">${e.label}</text>`);
  g += `<line id="cross" y1="${T}" y2="${H - B}" stroke="${css("--muted")}" stroke-width="1" opacity="0"/>`;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = g;
  const cross = svg.querySelector("#cross");
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), mx = (e.clientX - r.left) * W / r.width;
    let best = hist[0], bd = 1e9;
    hist.forEach(h => { const d = Math.abs(X(new Date(h.date).getTime()) - mx); if (d < bd) { bd = d; best = h; } });
    const cx = X(new Date(best.date).getTime());
    cross.setAttribute("x1", cx); cross.setAttribute("x2", cx); cross.setAttribute("opacity", 1);
    tip.innerHTML = `<b>${new Date(best.date).toLocaleDateString("fr-FR", {weekday: "short", day: "numeric", month: "long"})}</b>` +
      SERIES.map(s => `<div><i class="dot" style="background:var(${s.color})"></i> ${s.name} : ${fmt(best[s.key])}</div>`).join("");
    tip.style.opacity = 1;
    const px = cx * r.width / W;
    tip.style.left = Math.min(px + 12, r.width - tip.offsetWidth - 4) + "px"; tip.style.top = "10px";
  };
  svg.onmouseleave = () => { tip.style.opacity = 0; cross.setAttribute("opacity", 0); };
}

function goals(st) {
  const G = [
    ["YouTube", (st.youtube || {}).subscribers, 1000, "--s-yt"],
    ["Instagram", (st.instagram || {}).followers, 1000, "--s-ig"],
    ["TikTok", (st.tiktok || {}).followers, 10000, "--s-tt"],
  ];
  document.getElementById("goals").innerHTML = G.map(([n, v, goal, c]) => {
    const p = Math.min(100, (v || 0) / goal * 100);
    return `<div class="goal"><div class="row"><span>${n} · ${fmt(goal)} abonnés</span><small>${fmt(v || 0)} · ${p.toFixed(p < 10 ? 1 : 0)} %</small></div>
      <div class="bar"><i style="width:${Math.max(p, 1)}%;background:var(${c})"></i></div></div>`;
  }).join("");
}

function race(st) {
  const c = (st.race || {}).countries || {};
  const rows = Object.entries(c).sort((a, b) => (b[1].wins - a[1].wins) || (b[1].balls - a[1].balls)).slice(0, 10);
  const el = document.getElementById("race");
  if (!rows.length) { el.innerHTML = '<div class="empty">La première course n\'a pas encore eu lieu.</div>'; return; }
  el.innerHTML = `<table><tr><th>#</th><th>Pays</th><th class="num">Victoires</th><th class="num">Billes</th></tr>` +
    rows.map(([code, v], i) => `<tr><td>${i + 1}</td><td>${flag(code.slice(0, 2))} ${code.toUpperCase()}</td>
      <td class="num">${fmt(v.wins)}</td><td class="num">${fmt(v.balls)}</td></tr>`).join("") +
    `</table><div class="note">Jour ${fmt(st.race.day)} de la course</div>`;
}

let sortKey = "date", sortDir = -1;
function videos(st) {
  const vids = (st.videos || []).map(v => ({
    ...v, date: v.published_at || v.id,
    ytv: (v.yt || {}).views, igv: (v.ig || {}).views, likes: ((v.yt || {}).likes || 0) + ((v.ig || {}).likes || 0),
    com: ((v.yt || {}).comments || 0) + ((v.ig || {}).comments || 0),
  }));
  const el = document.getElementById("videos");
  if (!vids.length) { el.outerHTML = '<div class="empty">Aucune vidéo publiée pour l\'instant.</div>'; return; }
  const best = vids.reduce((a, v) => ((v.ytv || 0) + (v.igv || 0)) > ((a.ytv || 0) + (a.igv || 0)) ? v : a, vids[0]);
  const cols = [["date", "Vidéo"], ["kind", "Type"], ["ytv", "Vues YT", 1], ["igv", "Vues IG", 1], ["likes", "J'aime", 1], ["com", "Comm.", 1]];
  const draw = () => {
    vids.sort((a, b) => { const x = a[sortKey] ?? -1, y = b[sortKey] ?? -1; return (x > y ? 1 : x < y ? -1 : 0) * sortDir; });
    el.innerHTML = `<tr>${cols.map(([k, n, num]) => `<th data-k="${k}" class="${num ? "num" : ""}">${n}${sortKey === k ? (sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr>` +
      vids.map(v => `<tr class="${v === best ? "best" : ""}">
        <td>${v.title}<br><small style="color:var(--muted)">${v.id}${v.yt_url ? ` · <a href="${v.yt_url}" target="_blank" rel="noopener">YouTube</a>` : ""}${v.ig_url ? ` · <a href="${v.ig_url}" target="_blank" rel="noopener">Instagram</a>` : ""}</small></td>
        <td><span class="tag">${v.kind === "race" ? "COURSE" : "QUIZ"}</span></td>
        <td class="num">${fmt(v.ytv)}</td><td class="num">${fmt(v.igv)}</td><td class="num">${fmt(v.likes)}</td><td class="num">${fmt(v.com)}</td></tr>`).join("");
    el.querySelectorAll("th").forEach(th => th.onclick = () => {
      const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : -1; sortKey = k; draw();
    });
  };
  draw();
}

fetch("stats.json?" + Date.now()).then(r => r.json()).then(st => {
  document.getElementById("updated").textContent = "Mis à jour le " + new Date(st.updated).toLocaleString("fr-FR", {dateStyle: "medium", timeStyle: "short"});
  tiles(st); chart(st); goals(st); race(st); videos(st);
  if ((st.log || []).length) document.getElementById("log").textContent = "Notes : " + st.log.join(" · ");
  window.addEventListener("resize", () => chart(st));
}).catch(() => { document.getElementById("updated").textContent = "Stats indisponibles pour le moment."; });
</script>
</body>
</html>
